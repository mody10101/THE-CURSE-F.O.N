<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GATE</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #020000;
            color: #ff1a1a;
            font-family: 'Special Elite', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: crosshair;
        }

        /* Living Animated Background Fog */
        .fog-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .fog {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(120, 0, 0, 0.25) 0%, rgba(20, 0, 0, 0.85) 60%, rgba(0, 0, 0, 0.98) 100%);
            animation: swirl-fog 20s linear infinite alternate;
        }

        .fog2 {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(180, 10, 10, 0.2) 0%, rgba(30, 0, 0, 0.6) 50%, transparent 80%);
            animation: swirl-fog-reverse 30s linear infinite alternate;
            mix-blend-mode: screen;
        }

        @keyframes swirl-fog {
            0% { transform: translate(-10%, -10%) rotate(0deg) scale(1); }
            50% { transform: translate(10%, 5%) rotate(180deg) scale(1.1); }
            100% { transform: translate(-5%, 10%) rotate(360deg) scale(1); }
        }

        @keyframes swirl-fog-reverse {
            0% { transform: translate(5%, 10%) rotate(360deg) scale(1.05); }
            50% { transform: translate(-10%, -5%) rotate(180deg) scale(0.95); }
            100% { transform: translate(10%, -10%) rotate(0deg) scale(1.05); }
        }

        #emberCanvas, #glassCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        #emberCanvas {
            z-index: 2;
        }

        #glassCanvas {
            z-index: 10; /* Sits right over everything like wet glass */
        }

        .container {
            z-index: 20;
            text-align: center;
            border: 2px solid rgba(255, 26, 26, 0.5);
            padding: 40px;
            background: rgba(8, 0, 0, 0.88);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.4), inset 0 0 25px rgba(255, 0, 0, 0.2);
            max-width: 700px;
            width: 90%;
            animation: pulse-border 4s infinite;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 4rem;
            color: #ff0000;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #990000, 0 0 30px #4d0000;
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: glitch 2s infinite;
        }

        .date-sub {
            font-size: 1.2rem;
            color: #aa5555;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .time-box {
            background: #0d0202;
            border: 1px solid #731a1a;
            padding: 15px 10px;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.3);
        }

        .time-value {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            color: #ff3333;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
        }

        .time-label {
            font-size: 0.75rem;
            color: #884444;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .signal-btn {
            background: transparent;
            color: #ff1a1a;
            border: 1px solid #ff1a1a;
            padding: 12px 25px;
            font-family: 'Special Elite', monospace;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .signal-btn:hover {
            background: #ff1a1a;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

        .transmission-box {
            min-height: 60px;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.6);
            padding: 10px;
            border-top: 1px dashed #4a0d0d;
        }

        .translation {
            font-size: 0.9rem;
            color: #aa3333;
            margin-top: 5px;
            font-style: italic;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @keyframes pulse-border {
            0% { border-color: rgba(255, 26, 26, 0.3); box-shadow: 0 0 30px rgba(255, 0, 0, 0.2); }
            50% { border-color: rgba(255, 0, 0, 0.8); box-shadow: 0 0 70px rgba(255, 0, 0, 0.5); }
            100% { border-color: rgba(255, 26, 26, 0.3); box-shadow: 0 0 30px rgba(255, 0, 0, 0.2); }
        }

        @media (max-width: 600px) {
            .countdown-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <!-- Living Animated Fog Layers -->
    <div class="fog-container">
        <div class="fog"></div>
        <div class="fog2"></div>
    </div>

    <canvas id="emberCanvas"></canvas>
    <canvas id="glassCanvas"></canvas>

    <div class="container">
        <h1>THE GATE</h1>
        <div class="date-sub">January 18, 2027 · 8:00 PM Egypt Time</div>

        <div class="countdown-grid">

                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <button class="signal-btn" onclick="decodeSignal()">Decode The Signal</button>

        <div class="transmission-box" id="transmission">
            [AWAITING TRANSMISSION...]
            <div class="translation" id="translation"></div>
        </div>
    </div>
