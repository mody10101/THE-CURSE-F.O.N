<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE DAY OF DOOM</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030000;
            color: #b50b0b;
            font-family: 'Special Elite', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            cursor: crosshair;
        }

        .blood-drip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(181, 11, 11, 0) 50%, rgba(10, 0, 0, 0.95) 90%);
            z-index: 10;
        }

        #bloodCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .container {
            z-index: 20;
            text-align: center;
            border: 2px solid rgba(181, 11, 11, 0.3);
            padding: 40px;
            background: rgba(5, 0, 0, 0.85);
            box-shadow: 0 0 50px rgba(181, 11, 11, 0.2);
            max-width: 700px;
            width: 90%;
            animation: pulse-border 4s infinite;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 4rem;
            color: #d11111;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #500000;
            letter-spacing: 3px;
            margin-bottom: 10px;
            animation: glitch 2s infinite;
        }

        .date-sub {
            font-size: 1.2rem;
            color: #8c7373;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .time-box {
            background: #0d0202;
            border: 1px solid #4a0d0d;
            padding: 15px 10px;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.1);
        }

        .time-value {
            font-family: 'VT323', monospace;
            font-size: 3.2rem;
            color: #e63939;
            text-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }

        .time-label {
            font-size: 0.75rem;
            color: #665252;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .signal-btn {
            background: #1a0202;
            color: #ff3333;
            border: 1px solid #731a1a;
            padding: 12px 25px;
            font-family: 'Special Elite', monospace;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(115, 26, 26, 0.3);
            margin-bottom: 20px;
        }

        .signal-btn:hover {
            background: #4d0f0f;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
        }

        .transmission-box {
            min-height: 60px;
            font-family: 'VT323', monospace;
            font-size: 1.4rem;
            color: #b50b0b;
            text-shadow: 0 0 5px rgba(181, 11, 11, 0.5);
            padding: 10px;
            border-top: 1px dashed #260a0a;
        }

        .translation {
            font-size: 0.9rem;
            color: #594040;
            margin-top: 5px;
            font-style: italic;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        @keyframes pulse-border {
            0% { border-color: rgba(181, 11, 11, 0.2); box-shadow: 0 0 30px rgba(181, 11, 11, 0.1); }
            50% { border-color: rgba(181, 11, 11, 0.7); box-shadow: 0 0 70px rgba(255, 0, 0, 0.3); }
            100% { border-color: rgba(181, 11, 11, 0.2); box-shadow: 0 0 30px rgba(181, 11, 11, 0.1); }
        }

        @media(max-width: 600px) {
            .countdown-grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="blood-drip"></div>
    <canvas id="bloodCanvas"></canvas>

    <div class="container">
        <h1>THE DAY OF DOOM</h1>
        <div class="date-sub">January 18, 2027 · 8:00 PM Egypt Time</div>

        <div class="countdown-grid">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <button class="signal-btn" onclick="decodeSignal()">Decode The Signal</button>

        <div class="transmission-box" id="transmission">
            [AWAITING TRANSMISSION...]
            <div class="translation" id="translation"></div>
        </div>
    </div>

    <script>
        const targetDate = new Date('2027-01-18T20:00:00+02:00').getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            if (distance < 0) {
                document.getElementById('days').innerText = "00";
                document.getElementById('hours').innerText = "00";
                document.getElementById('minutes').innerText = "00";
                document.getElementById('seconds').innerText = "00";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        const signals = [
            { morse: "-.-. --- -- .. -. --. / - --- / -.-- --- ..-", text: "COMING TO YOU" },
            { morse: "-.. --- / -. --- - / - . . / - .... . / ... .... .- -.. --- .--s", text: "DO NOT SEE THE SHADOWS" },
            { morse: ".. / .- -- / .- .- / -. --- - / .- .-.. --- -. .", text: "I AM NOT ALONE" },
            { morse: "... .... ..-. / .- .-. . / .-- . .- .--. .. -. --.", text: "SHIPS ARE WEEPING" },
            { morse: "-.-- --- ..- / .-- . .-. . / .-- .- .-. -. . -..", text: "YOU WERE WARNED" },
            { morse: "..-. --- .-. --. . - / - .... . / -.-. .-.. --- -.-.", text: "FORGET THE CLOCK" }
        ];

        function decodeSignal() {
            const randomIndex = Math.floor(Math.random() * signals.length);
            const signal = signals[randomIndex];
            document.getElementById('transmission').innerText = signal.morse;
            document.getElementById('translation').innerText = `-> "${signal.text}"`;
            drawBloodSplatter(Math.random() * window.innerWidth, Math.random() * window.innerHeight, 1.2);
        }

        const canvas = document.getElementById('bloodCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawBloodSplatter(x, y, scale = 1) {
            ctx.save();
            ctx.translate(x, y);
            ctx.fillStyle = 'rgba(130, 5, 5, 0.75)';
            
            ctx.beginPath();
            ctx.arc(0, 0, (8 + Math.random() * 15) * scale, 0, Math.PI * 2);
            ctx.fill();

            for (let i = 0; i < 8; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = (10 + Math.random() * 35) * scale;
                const radius = (2 + Math.random() * 5);
                ctx.beginPath();
                ctx.arc(Math.cos(angle) * dist, Math.sin(angle) * dist, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        }

        function initBlood() {
            const now = new Date().getTime();
            const distance = targetDate - now;
            const totalSplatters = Math.max(5, Math.floor(50 - (distance / (1000 * 60 * 60 * 24))));
            
            for (let i = 0; i < Math.min(totalSplatters, 40); i++) {
                drawBloodSplatter(Math.random() * canvas.width, Math.random() * canvas.height, 0.8 + Math.random() * 0.8);
            }
        }
        initBlood();

        window.addEventListener('click', (e) => {
            drawBloodSplatter(e.clientX, e.clientY, 1.2);
        });
    </script>
</body>
</html>
