<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE GATE</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a0000 0%, #080000 50%, #000000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff1a1a;
            font-family: 'Special Elite', monospace;
            overflow: hidden;
            animation: pulse-bg 4s infinite alternate;
        }

        @keyframes pulse-bg {
            0% { background: radial-gradient(circle at center, #1a0000 0%, #080000 50%, #000000 100%); }
            100% { background: radial-gradient(circle at center, #330000 0%, #120000 60%, #000000 100%); }
        }

        .container {
            border: 2px solid #ff1a1a;
            padding: 40px;
            background: rgba(10, 0, 0, 0.85);
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4), inset 0 0 20px rgba(255, 0, 0, 0.2);
            text-align: center;
            max-width: 600px;
        }

        h1 {
            font-family: 'Creepster', cursive;
            font-size: 3.5rem;
            letter-spacing: 3px;
            color: #ff0000;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff0000, 0 0 20px #990000, 0 0 30px #4d0000;
        }

        .date {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #aa5555;
            margin-bottom: 30px;
        }

        .countdown {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .time-box {
            border: 1px solid #ff1a1a;
            padding: 15px 20px;
            min-width: 60px;
            background: rgba(20, 0, 0, 0.6);
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .number {
            font-size: 2rem;
            font-weight: bold;
            color: #ff3333;
            text-shadow: 0 0 8px #ff0000;
        }

        .label {
            font-size: 0.7rem;
            color: #884444;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .signal-btn {
            background: transparent;
            color: #ff1a1a;
            border: 1px solid #ff1a1a;
            padding: 10px 20px;
            font-family: 'Special Elite', monospace;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.2);
        }

        .signal-btn:hover {
            background: #ff1a1a;
            color: #000;
            box-shadow: 0 0 20px #ff0000;
        }

        .transmission {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #aa3333;
            letter-spacing: 1px;
            animation: flicker 2s infinite;
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>THE GATE</h1>
        <div class="date">JANUARY 18, 2027 · 8:00 PM EGYPT TIME</div>
        
        <div class="countdown">
            <div class="time-box">
                <div class="number">71</div>
                <div class="label">DAYS</div>
            </div>
            <div class="time-box">
                <div class="number">18</div>
                <div class="label">HOURS</div>
            </div>
            <div class="time-box">
                <div class="number">11</div>
                <div class="label">MINUTES</div>
            </div>
            <div class="time-box">
                <div class="number">21</div>
                <div class="label">SECONDS</div>
            </div>
        </div>

        <button class="signal-btn">[DECODE THE SIGNAL]</button>
        
        <div class="transmission">[AWAITING TRANSMISSION...]</div>
    </div>

</body>
</html>
